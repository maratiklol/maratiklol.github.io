    <meta property="og:image" content="https://maratik.lol/assets/android-chrome-512x512.png">

    <meta property="og:site_name" content="mrksbgg">
    <link rel="shortcut icon" href="/assets/favicon.ico">
    <link rel="manifest" href="/assets/site.webmanifest">
    <link rel="stylesheet" href="/css/radio.css">
</head>
<body>
    <div class="header">
        <h1>Ishak FM</h1>
        <p id="now-playing">Сейчас играет: Загрузка...</p>
        <p id="listeners">Слушателей: Загрузка...</p>
        <p class="telegram" id="telegram">
            Если имеются вопросы, задайте их мне в <a href="https://t.me/steamhvh" target="_blank">Telegram.</a>
        </p>
    </div>

    <div class='light x1'></div>
    <div class='light x2'></div>
    <div class='light x3'></div>
    <div class='light x4'></div>
    <div class='light x5'></div>
    <div class='light x6'></div>
    <div class='light x7'></div>
    <div class='light x8'></div>

    <audio class="player" controls autoplay>
      <source src="https://home.maratik.lol/stream" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <script>
        async function getTrackData() {
          try {
            const res = await fetch("https://home.maratik.lol/status-json.xsl");
            const buffer = await res.arrayBuffer();
        
            const text = new TextDecoder("UTF-8").decode(buffer);
        
            const data = JSON.parse(text);
            const source = data.icestats.source;
        
            const title = source.title;
            const listeners = source.listeners;
            document.getElementById("now-playing").innerHTML = `Сейчас играет:<br>${title}`;
            document.getElementById("listeners").textContent = `Слушателей: ${listeners}`;
          } catch (err) {
            console.error("Ошибка при получении трека:", err);
            document.getElementById("now-playing").textContent = "Стрим недоступен";
          }
        }

        getTrackData();
        setInterval(getTrackData, 5000);
    </script>
</body>
</html>
